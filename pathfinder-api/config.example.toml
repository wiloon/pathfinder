[server]
port = "8080"
session_secret = "change-me"

[database]
dsn = "pathfinder.db"

[ai]
api_key = ""
model = "MiniMax-Text-01"
base_url = "https://api.minimaxi.chat/v1"

[resend]
api_key = ""
from = "Pathfinder <noreply@yourdomain.com>"

[app]
frontend_base_url = "http://localhost:3000"
# ai_provider = "minimax" | "openclaw" (default: minimax)
ai_provider = "minimax"

[openclaw]
webhook_url = ""
webhook_secret = ""
sync_url = ""
# service_token: shared secret for OpenClaw → Pathfinder machine-to-machine calls
service_token = ""
# service_user_id: the Pathfinder user ID that service token requests act as
service_user_id = ""
